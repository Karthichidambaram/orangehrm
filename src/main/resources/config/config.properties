# ===========================================================================
# Default configuration.
#
# Precedence (highest wins):
#   1. -Dkey=value on the command line
#   2. config-{env}.properties
#   3. this file
#
# So CI never edits a file; it passes -D flags.
# ===========================================================================
env=qa
baseUrl=https://opensource-demo.orangehrmlive.com

browser=chrome
headless=false

# local | remote
runMode=local
gridUrl=http://localhost:4444/wd/hub

# Seconds
explicitWait=15
pageLoadTimeout=40

retryCount=1
screenshotOnFailure=true
screenshotOnPass=false

# Public demo sandbox credentials - safe to commit.
# A real environment would read these from env vars, never from this file.
admin.username=Admin
admin.password=admin123
