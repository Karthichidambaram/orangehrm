name: CI

# =============================================================================
# TIER 1 of the pipeline: the fast gate.
#
# Runs on every push and every PR. Deliberately does NOT launch a browser or
# touch the OrangeHRM demo site. It answers one question in under a minute:
# "does this code still build?"
#
# That is roughly 90% of the breakage you will actually cause while developing
# (a missing import, a renamed method, a bad dependency version), caught at
# 40 seconds instead of 8 minutes.
# =============================================================================

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you click "Run workflow" in the Actions tab

# Least privilege. This job only reads the repo, so say so explicitly rather
# than inheriting the default write token.
permissions:
  contents: read

# If you push twice in quick succession, cancel the first run. Saves minutes
# and stops you reading a result that is already out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository keyed on pom.xml. First run is slow,
          # every run after is seconds. Without this you re-download
          # Selenium and friends on every single push.
          cache: maven

      # -D flags:
      #   -B   batch mode, no interactive prompts, cleaner logs
      #   -ntp no transfer progress, kills thousands of download lines
      - name: Compile framework
        run: mvn -B -ntp clean compile

      # test-compile compiles src/test/java WITHOUT running anything.
      # This is the step that catches a broken test class, and it is the
      # reason this workflow is useful from commit #1 onward: it is already
      # meaningful before a single @Test exists.
      - name: Compile tests
        run: mvn -B -ntp test-compile

      - name: Dependency tree
        # Useful artefact when a version conflict appears. Cheap to produce
        # and it means you never have to reproduce the problem locally first.
        run: mvn -B -ntp dependency:tree -DoutputFile=target/dependency-tree.txt

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: target/dependency-tree.txt
          retention-days: 7
          if-no-files-found: ignore
